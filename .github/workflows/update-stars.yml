name: Update profile stars

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stars.py
      - .github/workflows/update-stars.yml

permissions:
  contents: write

concurrency:
  group: profile-stars
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Calculate total stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_stars.py
      - name: Commit refreshed badge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/total-stars.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile star count"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
